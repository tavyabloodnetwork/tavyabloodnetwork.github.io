<!-- ============================================================
     TAVYA BLOOD NETWORK
     REUSABLE LOGO COMPONENT

     FILE:
     logo.html

     EMBED:
     <div id="tavya-logo"></div>

     LOAD:
     fetch("logo.html")
       .then(r => r.text())
       .then(html => {
           document.getElementById("tavya-logo").innerHTML = html;
       });

     IMPORTANT:
     This file intentionally contains NO:
       <!DOCTYPE html>
       <html>
       <head>
       <body>

     It is a component, not a standalone webpage.
     ============================================================ -->


<style>

/* ============================================================
   FONT
   ============================================================ */

@import url(
    'https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600;700&family=Raleway:wght@400;500;600&display=swap'
);


/* ============================================================
   LOGO COMPONENT
   ============================================================ */

.tavya-logo-component {

    width: 100%;
    max-width: 520px;

    margin: 0 auto;
    padding: 0;

    display: block;

    background: transparent !important;

    line-height: 0;

    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;

}


/* ============================================================
   SVG
   ============================================================ */

.tavya-logo-component .tavya-logo-svg {

    display: block;

    width: 100%;
    height: auto;

    max-width: 100%;

    margin: 0;
    padding: 0;

    background: transparent !important;

    overflow: visible;

    cursor: pointer;

}


/* ============================================================
   SVG ELEMENT PROTECTION

   These !important declarations prevent the main website CSS
   from accidentally changing the logo colours.
   ============================================================ */


/* BLUE HAND */

.tavya-logo-component .left-hand {

    fill: url(#tavyaBlueHandGradient) !important;
    stroke: none !important;

}


/* RED HAND */

.tavya-logo-component .right-hand {

    fill: url(#tavyaRedHandGradient) !important;
    stroke: none !important;

}


/* MAIN BLOOD DROP */

.tavya-logo-component .blood-drop {

    fill: url(#tavyaBloodGradient) !important;
    stroke: none !important;

}


/* TAVYA */

.tavya-logo-component .tavya-word {

    fill: #0874AE !important;
    stroke: none !important;

}


/* BLOOD NETWORK */

.tavya-logo-component .network-text {

    fill: #E21B23 !important;
    stroke: none !important;

}


/* SUBTITLE */

.tavya-logo-component .subtitle {

    fill: #626B73 !important;
    stroke: none !important;

}


/* TAGLINE */

.tavya-logo-component .tagline {

    fill: #E21B23 !important;
    stroke: none !important;

}


/* FOOTER */

.tavya-logo-component .footer-text {

    fill: #737B83 !important;
    stroke: none !important;

}


/* MAIN HEART */

.tavya-logo-component .heart {

    fill: #FFFFFF !important;
    stroke: none !important;

}


/* SMALL DROPLETS */

.tavya-logo-component .letter-drop,
.tavya-logo-component .middle-drop {

    fill: #E21B23 !important;
    stroke: none !important;

}


/* SMALL HEART */

.tavya-logo-component .middle-heart {

    fill: #E21B23 !important;
    stroke: none !important;

}


/* OUTER ARC */

.tavya-logo-component .outer-arc {

    fill: none !important;

    stroke: #E21B23 !important;

    stroke-width: 8;

    stroke-linecap: round;

}


/* HAND HIGHLIGHTS */

.tavya-logo-component .hand-highlight {

    fill: none !important;

    stroke: rgba(255,255,255,0.38) !important;

    stroke-width: 5;

    stroke-linecap: round;

}


/* DROP HIGHLIGHT */

.tavya-logo-component .drop-highlight {

    fill: none !important;

    stroke: rgba(255,255,255,0.42) !important;

    stroke-width: 8;

    stroke-linecap: round;

}


/* CONNECTING LINES */

.tavya-logo-component .middle-line {

    fill: none !important;

    stroke: #E21B23 !important;

    stroke-width: 3;

    stroke-linecap: round;

}


.tavya-logo-component .middle-connection {

    fill: none !important;

    stroke: #E21B23 !important;

    stroke-width: 2;

    stroke-linecap: round;

    opacity: .65;

}


.tavya-logo-component .middle-node {

    fill: #E21B23 !important;

    stroke: none !important;

}


/* ============================================================
   DARK BACKGROUND MODE

   Use:

   <div id="tavya-logo" class="tavya-dark">

   when the surrounding page is dark.

   This makes TAVYA and supporting text clearly visible.
   ============================================================ */

.tavya-logo-component.tavya-dark
.tavya-word {

    fill: #1986C2 !important;

}


.tavya-logo-component.tavya-dark
.subtitle {

    fill: rgba(255,255,255,0.78) !important;

}


.tavya-logo-component.tavya-dark
.footer-text {

    fill: rgba(255,255,255,0.42) !important;

}


/* ============================================================
   ANIMATION INITIAL STATES
   ============================================================ */


/* ARC */

.tavya-logo-component .outer-arc {

    opacity: 0;

    stroke-dasharray: 1800;
    stroke-dashoffset: 1800;

    animation:
        tavyaArcDraw
        1.25s
        ease
        .05s
        forwards;

}


/* LEFT HAND */

.tavya-logo-component .left-hand {

    opacity: 0;

    transform-origin: center;

    animation:
        tavyaLeftHand
        .9s
        cubic-bezier(.2,.8,.2,1)
        .25s
        forwards;

}


/* RIGHT HAND */

.tavya-logo-component .right-hand {

    opacity: 0;

    transform-origin: center;

    animation:
        tavyaRightHand
        .9s
        cubic-bezier(.2,.8,.2,1)
        .25s
        forwards;

}


/* HAND HIGHLIGHTS */

.tavya-logo-component .hand-highlight {

    opacity: 0;

    stroke-dasharray: 300;
    stroke-dashoffset: 300;

    animation:
        tavyaHighlight
        .75s
        ease
        .9s
        forwards;

}


/* MAIN DROP */

.tavya-logo-component .blood-drop {

    opacity: 0;

    transform-box: fill-box;
    transform-origin: center;

    animation:
        tavyaDropAppear
        .85s
        cubic-bezier(.2,.8,.2,1)
        .65s
        forwards,

        tavyaDropFloat
        3.2s
        ease-in-out
        1.8s
        infinite;

}


/* DROP HIGHLIGHT */

.tavya-logo-component .drop-highlight {

    opacity: 0;

    stroke-dasharray: 180;
    stroke-dashoffset: 180;

    animation:
        tavyaDropHighlight
        .7s
        ease
        1.1s
        forwards;

}


/* MAIN HEART */

.tavya-logo-component .heart {

    opacity: 0;

    transform-box: fill-box;
    transform-origin: center;

    animation:
        tavyaHeartAppear
        .7s
        ease
        1.25s
        forwards,

        tavyaMainHeartBeat
        2.7s
        ease-in-out
        2.3s
        infinite;

}


/* TAVYA */

.tavya-logo-component .tavya-word {

    opacity: 0;

    animation:
        tavyaWordAppear
        .7s
        ease
        1.65s
        forwards;

}


/* A DROPLETS */

.tavya-logo-component .letter-drop {

    opacity: 0;

    transform-box: fill-box;
    transform-origin: center;

    animation:
        tavyaLetterDropAppear
        .55s
        ease
        2s
        forwards,

        tavyaLetterDropPulse
        2.6s
        ease-in-out
        2.8s
        infinite;

}


/* BLOOD NETWORK */

.tavya-logo-component .network-text {

    opacity: 0;

    animation:
        tavyaTextAppear
        .6s
        ease
        2.25s
        forwards;

}


/* SUBTITLE */

.tavya-logo-component .subtitle {

    opacity: 0;

    animation:
        tavyaTextAppear
        .6s
        ease
        2.45s
        forwards;

}


/* TAGLINE */

.tavya-logo-component .tagline {

    opacity: 0;

    animation:
        tavyaTagline
        .75s
        ease
        2.7s
        forwards;

}


/* MIDDLE LINES */

.tavya-logo-component .middle-line {

    opacity: 0;

    animation:
        tavyaMiddleLine
        .6s
        ease
        3.1s
        forwards;

}


.tavya-logo-component .middle-connection {

    opacity: 0;

    animation:
        tavyaMiddleConnection
        .6s
        ease
        3.2s
        forwards;

}


.tavya-logo-component .middle-node {

    opacity: 0;

    animation:
        tavyaMiddleNode
        .5s
        ease
        3.25s
        forwards;

}


/* SMALL DROP */

.tavya-logo-component .middle-drop {

    opacity: 0;

    transform-box: fill-box;
    transform-origin: center;

    animation:
        tavyaMiddleDrop
        .6s
        ease
        3.35s
        forwards,

        tavyaMiddleDropPulse
        2.2s
        ease-in-out
        4s
        infinite;

}


/* SMALL HEART */

.tavya-logo-component .middle-heart {

    opacity: 0;

    transform-box: fill-box;
    transform-origin: center;

    animation:
        tavyaMiddleHeart
        .65s
        ease
        3.45s
        forwards,

        tavyaMiddleHeartBeat
        2.2s
        ease-in-out
        4.1s
        infinite;

}


/* FOOTER */

.tavya-logo-component .footer-text {

    opacity: 0;

    animation:
        tavyaTextAppear
        .6s
        ease
        3.7s
        forwards;

}


/* ============================================================
   KEYFRAMES
   ============================================================ */


@keyframes tavyaArcDraw {

    0% {

        opacity: 0;

        stroke-dashoffset: 1800;

    }

    100% {

        opacity: 1;

        stroke-dashoffset: 0;

    }

}


@keyframes tavyaLeftHand {

    0% {

        opacity: 0;

        transform:
            translateX(-35px)
            translateY(20px)
            scale(.97);

    }

    70% {

        opacity: 1;

    }

    100% {

        opacity: 1;

        transform:
            translateX(0)
            translateY(0)
            scale(1);

    }

}


@keyframes tavyaRightHand {

    0% {

        opacity: 0;

        transform:
            translateX(35px)
            translateY(20px)
            scale(.97);

    }

    70% {

        opacity: 1;

    }

    100% {

        opacity: 1;

        transform:
            translateX(0)
            translateY(0)
            scale(1);

    }

}


@keyframes tavyaHighlight {

    0% {

        opacity: 0;

        stroke-dashoffset: 300;

    }

    100% {

        opacity: 1;

        stroke-dashoffset: 0;

    }

}


@keyframes tavyaDropAppear {

    0% {

        opacity: 0;

        transform:
            translateY(-25px)
            scale(.78);

    }

    70% {

        opacity: 1;

        transform:
            translateY(3px)
            scale(1.03);

    }

    100% {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

    }

}


@keyframes tavyaDropFloat {

    0%,
    100% {

        transform: translateY(0);

    }

    50% {

        transform: translateY(-4px);

    }

}


@keyframes tavyaDropHighlight {

    0% {

        opacity: 0;

        stroke-dashoffset: 180;

    }

    100% {

        opacity: 1;

        stroke-dashoffset: 0;

    }

}


@keyframes tavyaHeartAppear {

    0% {

        opacity: 0;

        transform: scale(.35);

    }

    65% {

        opacity: 1;

        transform: scale(1.12);

    }

    100% {

        opacity: 1;

        transform: scale(1);

    }

}


@keyframes tavyaMainHeartBeat {

    0%,
    100% {

        transform: scale(1);

    }

    10% {

        transform: scale(1.07);

    }

    20% {

        transform: scale(1);

    }

    30% {

        transform: scale(1.05);

    }

    40% {

        transform: scale(1);

    }

}


@keyframes tavyaWordAppear {

    0% {

        opacity: 0;

        transform: translateY(15px);

    }

    100% {

        opacity: 1;

        transform: translateY(0);

    }

}


@keyframes tavyaLetterDropAppear {

    0% {

        opacity: 0;

        transform:
            translateY(-8px)
            scale(.65);

    }

    70% {

        opacity: 1;

        transform:
            translateY(2px)
            scale(1.05);

    }

    100% {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

    }

}


@keyframes tavyaLetterDropPulse {

    0%,
    100% {

        transform: scale(1);

    }

    50% {

        transform: scale(1.06);

    }

}


@keyframes tavyaTextAppear {

    0% {

        opacity: 0;

        transform: translateY(9px);

    }

    100% {

        opacity: 1;

        transform: translateY(0);

    }

}


@keyframes tavyaTagline {

    0% {

        opacity: 0;

        transform:
            translateY(12px)
            scale(.97);

    }

    100% {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

    }

}


@keyframes tavyaMiddleLine {

    0% {

        opacity: 0;

        transform: scaleX(0);

    }

    100% {

        opacity: 1;

        transform: scaleX(1);

    }

}


@keyframes tavyaMiddleConnection {

    0% {

        opacity: 0;

        stroke-dasharray: 60;
        stroke-dashoffset: 60;

    }

    100% {

        opacity: .65;

        stroke-dasharray: 60;
        stroke-dashoffset: 0;

    }

}


@keyframes tavyaMiddleNode {

    0% {

        opacity: 0;

        transform: scale(0);

    }

    70% {

        opacity: 1;

        transform: scale(1.3);

    }

    100% {

        opacity: 1;

        transform: scale(1);

    }

}


@keyframes tavyaMiddleDrop {

    0% {

        opacity: 0;

        transform: scale(.5);

    }

    70% {

        opacity: 1;

        transform: scale(1.08);

    }

    100% {

        opacity: 1;

        transform: scale(1);

    }

}


@keyframes tavyaMiddleDropPulse {

    0%,
    100% {

        transform: scale(1);

    }

    50% {

        transform: scale(1.10);

    }

}


@keyframes tavyaMiddleHeart {

    0% {

        opacity: 0;

        transform: scale(.3);

    }

    70% {

        opacity: 1;

        transform: scale(1.12);

    }

    100% {

        opacity: 1;

        transform: scale(1);

    }

}


@keyframes tavyaMiddleHeartBeat {

    0%,
    100% {

        transform: scale(1);

    }

    10% {

        transform: scale(1.18);

    }

    20% {

        transform: scale(1);

    }

    30% {

        transform: scale(1.12);

    }

    40% {

        transform: scale(1);

    }

}


/* ============================================================
   MOBILE
   ============================================================ */

@media (max-width: 600px) {

    .tavya-logo-component {

        max-width: 430px;

    }

}

</style>

<script>

/* ============================================================
   TAVYA LOGO COMPONENT SCRIPT

   Replay animation when the logo is clicked.
   ============================================================ */

(function () {


    /* --------------------------------------------------------
       Find THIS component only.
       -------------------------------------------------------- */

    const components =
        document.querySelectorAll(
            ".tavya-logo-component"
        );


    components.forEach(function (component) {


        const logo =
            component.querySelector(
                ".tavya-logo-svg"
            );


        if (!logo) {
            return;
        }


        /* ----------------------------------------------------
           Prevent right-click on logo
           ---------------------------------------------------- */

        logo.addEventListener(
            "contextmenu",
            function (event) {

                event.preventDefault();

            }
        );


        /* ----------------------------------------------------
           Replay animation on click
           ---------------------------------------------------- */

        logo.addEventListener(
            "click",
            function () {


                const animatedElements =
                    logo.querySelectorAll(

                        ".outer-arc," +

                        ".left-hand," +

                        ".right-hand," +

                        ".hand-highlight," +

                        ".blood-drop," +

                        ".drop-highlight," +

                        ".heart," +

                        ".tavya-word," +

                        ".letter-drop," +

                        ".network-text," +

                        ".subtitle," +

                        ".tagline," +

                        ".middle-line," +

                        ".middle-connection," +

                        ".middle-node," +

                        ".middle-drop," +

                        ".middle-heart," +

                        ".footer-text"

                    );


                animatedElements.forEach(
                    function (element) {


                        element.style.animation =
                            "none";


                        /*
                         Force browser reflow so
                         animation restarts.
                        */

                        void element.offsetWidth;


                        element.style.animation =
                            "";

                    }
                );

            }

        );

    });


})();

</script>
