<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TAVYA Blood Network</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600;700&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #ffffff;
    overflow: hidden;
}

.logo-wrapper {
    width: min(96vw, 760px);
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
}

.tavya-logo {
    display: block;
    width: 100%;
    height: auto;
}

/* =========================================================
   COLORS
   ========================================================= */

.left-hand,
.right-hand,
.blood-drop,
.letter-drop,
.middle-drop {
    stroke: none;
}

.tavya-word {
    fill: #123d72;
}

.network-text {
    fill: #df1722;
    letter-spacing: 2px;
}

.subtitle {
    fill: #444444;
    letter-spacing: 1px;
}

.tagline {
    fill: #df1722;
}

.footer-text {
    fill: #777777;
    letter-spacing: 1.8px;
}

.hand-highlight {
    fill: none;
    stroke: rgba(255,255,255,0.30);
    stroke-width: 5;
    stroke-linecap: round;
}

.outer-arc {
    fill: none;
    stroke: #df1722;
    stroke-width: 9;
    stroke-linecap: round;
}

.drop-highlight {
    fill: none;
    stroke: rgba(255,255,255,0.42);
    stroke-width: 8;
    stroke-linecap: round;
}

.heart {
    fill: #ffffff !important;
}

.middle-line,
.middle-connection {
    fill: none;
    stroke: #df1722;
    stroke-linecap: round;
}

.middle-line {
    stroke-width: 3;
}

.middle-connection {
    stroke-width: 2;
    opacity: 0.65;
}

.middle-node {
    fill: #df1722;
}

.middle-heart {
    fill: #df1722;
}

.middle-drop {
    fill: #df1722;
}

/* =========================================================
   GRADIENTS
   ========================================================= */

#blueHandGradient stop:first-child {
    stop-color: #1d6fba;
}

#blueHandGradient stop:last-child {
    stop-color: #0c3d78;
}

#redHandGradient stop:first-child {
    stop-color: #f2343d;
}

#redHandGradient stop:last-child {
    stop-color: #bd0712;
}

#bloodGradient stop:first-child {
    stop-color: #f22932;
}

#bloodGradient stop:last-child {
    stop-color: #b80712;
}

/* =========================================================
   INITIAL STATES
   ========================================================= */

.outer-arc {
    opacity: 0;
    stroke-dasharray: 1800;
    stroke-dashoffset: 1800;
    animation: arcDraw 1.3s ease 0.05s forwards;
}

.left-hand {
    opacity: 0;
    transform-origin: center;
    animation:
        handAppearLeft 0.95s cubic-bezier(.2,.8,.2,1) 0.35s forwards;
}

.right-hand {
    opacity: 0;
    transform-origin: center;
    animation:
        handAppearRight 0.95s cubic-bezier(.2,.8,.2,1) 0.35s forwards;
}

.hand-highlight {
    opacity: 0;
    stroke-dasharray: 300;
    stroke-dashoffset: 300;
    animation:
        highlightDraw 0.8s ease 0.95s forwards;
}

.blood-drop {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    animation:
        dropAppear 0.9s cubic-bezier(.2,.8,.2,1) 0.75s forwards,
        dropFloat 3s ease-in-out 1.8s infinite;
}

.drop-highlight {
    opacity: 0;
    stroke-dasharray: 180;
    stroke-dashoffset: 180;
    animation:
        highlightDrop 0.7s ease 1.25s forwards;
}

.heart {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    animation:
        heartAppear 0.7s ease 1.45s forwards,
        mainHeartBeat 2.6s ease-in-out 2.5s infinite;
}

.tavya-word {
    opacity: 0;
    animation:
        wordAppear 0.65s ease 1.75s forwards;
}

.letter-drop {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    animation:
        letterDropAppear 0.55s ease 2.05s forwards,
        letterDropPulse 2.4s ease-in-out 2.8s infinite;
}

.network-text {
    opacity: 0;
    animation:
        textAppear 0.65s ease 2.25s forwards;
}

.subtitle {
    opacity: 0;
    animation:
        textAppear 0.65s ease 2.45s forwards;
}

.tagline {
    opacity: 0;
    animation:
        taglineAppear 0.8s ease 2.75s forwards;
}

.middle-design {
    opacity: 1;
}

.middle-line,
.middle-connection,
.middle-node {
    opacity: 0;
}

.middle-line {
    animation:
        middleLineAppear 0.6s ease 3.15s forwards;
}

.middle-connection {
    animation:
        middleConnectionAppear 0.6s ease 3.25s forwards;
}

.middle-node {
    animation:
        middleNodeAppear 0.5s ease 3.3s forwards;
}

.middle-drop {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    animation:
        middleDropAppear 0.6s ease 3.45s forwards,
        middleDropPulse 2.2s ease-in-out 4.3s infinite;
}

.middle-heart {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    animation:
        middleHeartAppear 0.7s ease 3.55s forwards,
        middleHeartBeat 2.2s ease-in-out 4.3s infinite;
}

.footer-text {
    opacity: 0;
    animation:
        textAppear 0.6s ease 3.8s forwards;
}

/* =========================================================
   ANIMATIONS
   ========================================================= */

@keyframes arcDraw {
    0% {
        opacity: 0;
        stroke-dashoffset: 1800;
    }
    100% {
        opacity: 1;
        stroke-dashoffset: 0;
    }
}

@keyframes handAppearLeft {
    0% {
        opacity: 0;
        transform: translateX(-45px) translateY(25px) scale(0.96);
    }
    70% {
        opacity: 1;
    }
    100% {
        opacity: 1;
        transform: translateX(0) translateY(0) scale(1);
    }
}

@keyframes handAppearRight {
    0% {
        opacity: 0;
        transform: translateX(45px) translateY(25px) scale(0.96);
    }
    70% {
        opacity: 1;
    }
    100% {
        opacity: 1;
        transform: translateX(0) translateY(0) scale(1);
    }
}

@keyframes highlightDraw {
    0% {
        opacity: 0;
        stroke-dashoffset: 300;
    }
    100% {
        opacity: 1;
        stroke-dashoffset: 0;
    }
}

@keyframes dropAppear {
    0% {
        opacity: 0;
        transform: translateY(-25px) scale(0.8);
    }
    70% {
        opacity: 1;
        transform: translateY(4px) scale(1.03);
    }
    100% {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes dropFloat {
    0%,
    100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-5px);
    }
}

@keyframes highlightDrop {
    0% {
        opacity: 0;
        stroke-dashoffset: 180;
    }
    100% {
        opacity: 1;
        stroke-dashoffset: 0;
    }
}

@keyframes heartAppear {
    0% {
        opacity: 0;
        transform: scale(0.4);
    }
    65% {
        opacity: 1;
        transform: scale(1.12);
    }
    100% {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes mainHeartBeat {
    0%,
    100% {
        transform: scale(1);
    }
    10% {
        transform: scale(1.07);
    }
    20% {
        transform: scale(1);
    }
    30% {
        transform: scale(1.05);
    }
    40% {
        transform: scale(1);
    }
}

@keyframes wordAppear {
    0% {
        opacity: 0;
        transform: translateY(18px);
    }
    100% {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes letterDropAppear {
    0% {
        opacity: 0;
        transform: translateY(-10px) scale(0.65);
    }
    70% {
        opacity: 1;
        transform: translateY(2px) scale(1.05);
    }
    100% {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes letterDropPulse {
    0%,
    100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.07);
    }
}

@keyframes textAppear {
    0% {
        opacity: 0;
        transform: translateY(10px);
    }
    100% {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes taglineAppear {
    0% {
        opacity: 0;
        transform: translateY(15px) scale(0.96);
    }
    100% {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes middleLineAppear {
    0% {
        opacity: 0;
        transform: scaleX(0);
    }
    100% {
        opacity: 1;
        transform: scaleX(1);
    }
}

@keyframes middleConnectionAppear {
    0% {
        opacity: 0;
        stroke-dasharray: 60;
        stroke-dashoffset: 60;
    }
    100% {
        opacity: 0.65;
        stroke-dasharray: 60;
        stroke-dashoffset: 0;
    }
}

@keyframes middleNodeAppear {
    0% {
        opacity: 0;
        transform: scale(0);
    }
    70% {
        opacity: 1;
        transform: scale(1.3);
    }
    100% {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes middleDropAppear {
    0% {
        opacity: 0;
        transform: translateY(-8px) scale(0.5);

    70% {
        opacity: 1;
        transform: translateY(2px) scale(1.08);
    }
    100% {

    }
}

@keyframes middleDropPulse {
    0%,

        transform: scale(1);

    50% {
        transform: scale(1.12);
    }
}

@keyframes middleHeartAppear {

    }
}

<script>

/* =========================================================
   DISABLE RIGHT CLICK
   ========================================================= */

document.addEventListener("contextmenu", function(event) {
    event.preventDefault();
});


/* =========================================================
   DISABLE COMMON COPY / SAVE SHORTCUTS
   ========================================================= */

document.addEventListener("keydown", function(event) {

    if (
        (event.ctrlKey || event.metaKey) &&
        (
            event.key.toLowerCase() === "c" ||
            event.key.toLowerCase() === "u" ||
            event.key.toLowerCase() === "s" ||
            event.key.toLowerCase() === "a"
        )
    ) {
        event.preventDefault();
    }

});


/* =========================================================
   REPLAY LOGO ANIMATION ON CLICK
   ========================================================= */

document
.querySelector(".tavya-logo")
.addEventListener("click", function() {

    const animatedElements = document.querySelectorAll(

        ".outer-arc, " +

        ".left-hand, " +

        ".right-hand, " +

        ".hand-highlight, " +

        ".blood-drop, " +

        ".drop-highlight, " +

        ".heart, " +

        ".tavya-word, " +

        ".letter-drop, " +

        ".network-text, " +

        ".subtitle, " +

        ".tagline, " +

        ".middle-design, " +

        ".middle-line, " +

        ".middle-connection, " +

        ".middle-node, " +

        ".middle-heart, " +

        ".middle-drop, " +

        ".footer-text"

    );


    animatedElements.forEach(function(element) {

        element.style.animation = "none";

        void element.offsetWidth;

        element.style.animation = "";

    });

});

</script>
