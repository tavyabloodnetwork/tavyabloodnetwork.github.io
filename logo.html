<!-- ============================================================
     TAVYA BLOOD NETWORK
     REUSABLE LOGO COMPONENT

     FILE NAME:
     logo.html

     USE:
     <div id="tavya-logo"></div>

     Then:
     <script>
     fetch("logo.html")
       .then(r => r.text())
       .then(html => {
           document.getElementById("tavya-logo").innerHTML = html;
       });
     </script>

     IMPORTANT:
     - Transparent background
     - Colours are hard-coded inside SVG
     - Safe for dark/light pages
     - No external logo image required
     - Main heart is PURE WHITE
     - Left hand = BLUE
     - Right hand = RED
     - TAVYA = BLUE
     - Blood Network = RED
     ============================================================ -->


<style>

/* ============================================================
   TAVYA LOGO CONTAINER
   ============================================================ */

#tavya-logo {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;

    background: transparent !important;

    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
}


/* ============================================================
   SVG
   ============================================================ */

#tavya-logo .tavya-logo {
    display: block;

    width: 100% !important;
    max-width: 100% !important;

    height: auto !important;

    margin: 0 !important;
    padding: 0 !important;

    background: transparent !important;

    overflow: visible;

    cursor: pointer;

    /*
       Prevent website-wide SVG rules from changing
       the logo dimensions.
    */
    box-sizing: border-box;
}


/* ============================================================
   IMPORTANT:
   Prevent parent page styles from making SVG elements black.
   Every important element also has a direct SVG fill.
   ============================================================ */

#tavya-logo .tavya-blue {
    fill: #0877B9 !important;
}

#tavya-logo .tavya-red {
    fill: #E21B23 !important;
}

#tavya-logo .tavya-white {
    fill: #FFFFFF !important;
}

#tavya-logo .tavya-dark-blue {
    fill: #07517F !important;
}

#tavya-logo .tavya-gray {
    fill: #6B7280 !important;
}


/* ============================================================
   ARC
   ============================================================ */

#tavya-logo .outer-arc {
    fill: none !important;
    stroke: #E21B23 !important;
    stroke-width: 8;
    stroke-linecap: round;
}


/* ============================================================
   HAND HIGHLIGHTS
   ============================================================ */

#tavya-logo .hand-highlight {
    fill: none !important;
    stroke: rgba(255,255,255,0.38) !important;
    stroke-width: 5;
    stroke-linecap: round;
}


/* ============================================================
   DROP HIGHLIGHT
   ============================================================ */

#tavya-logo .drop-highlight {
    fill: none !important;
    stroke: rgba(255,255,255,0.40) !important;
    stroke-width: 8;
    stroke-linecap: round;
}


/* ============================================================
   TEXT
   ============================================================ */

#tavya-logo .network-text {
    fill: #E21B23 !important;
}

#tavya-logo .subtitle {
    fill: #6B7280 !important;
}

#tavya-logo .tagline {
    fill: #E21B23 !important;
}

#tavya-logo .footer-text {
    fill: #7B8490 !important;
}


/* ============================================================
   DARK PAGE VERSION

   Add:

   <div id="tavya-logo" class="dark-background">

   if the page background is dark.
   ============================================================ */

#tavya-logo.dark-background .tavya-dark-blue {
    fill: #49A7DF !important;
}

#tavya-logo.dark-background .subtitle {
    fill: rgba(255,255,255,0.82) !important;
}

#tavya-logo.dark-background .footer-text {
    fill: rgba(255,255,255,0.48) !important;
}


/* ============================================================
   MIDDLE DESIGN
   ============================================================ */

#tavya-logo .middle-line {
    fill: none !important;
    stroke: #E21B23 !important;
    stroke-width: 3;
    stroke-linecap: round;
}

#tavya-logo .middle-connection {
    fill: none !important;
    stroke: #E21B23 !important;
    stroke-width: 2;
    stroke-linecap: round;
}

#tavya-logo .middle-node {
    fill: #E21B23 !important;
}

#tavya-logo .middle-drop {
    fill: #E21B23 !important;
}

#tavya-logo .middle-heart {
    fill: #E21B23 !important;
}


/* ============================================================
   INITIAL ANIMATION
   ============================================================ */

#tavya-logo .outer-arc {
    opacity: 0;

    stroke-dasharray: 1800;
    stroke-dashoffset: 1800;

    animation:
        tavyaArcDraw
        1.25s
        ease
        0.05s
        forwards;
}


#tavya-logo .left-hand {
    opacity: 0;

    transform-origin: center;

    animation:
        tavyaLeftHand
        0.9s
        cubic-bezier(.2,.8,.2,1)
        0.25s
        forwards;
}


#tavya-logo .right-hand {
    opacity: 0;

    transform-origin: center;

    animation:
        tavyaRightHand
        0.9s
        cubic-bezier(.2,.8,.2,1)
        0.25s
        forwards;
}


#tavya-logo .hand-highlight {
    opacity: 0;

    stroke-dasharray: 300;
    stroke-dashoffset: 300;

    animation:
        tavyaHighlight
        0.75s
        ease
        0.85s
        forwards;
}


#tavya-logo .blood-drop {
    opacity: 0;

    transform-box: fill-box;
    transform-origin: center;

    animation:
        tavyaDropAppear
        0.85s
        cubic-bezier(.2,.8,.2,1)
        0.65s
        forwards,

        tavyaDropFloat
        3.2s
        ease-in-out
        1.8s
        infinite;
}


#tavya-logo .drop-highlight {
    opacity: 0;

    stroke-dasharray: 180;
    stroke-dashoffset: 180;

    animation:
        tavyaDropHighlight
        0.7s
        ease
        1.1s
        forwards;
}


#tavya-logo .heart {
    opacity: 0;

    transform-box: fill-box;
    transform-origin: center;

    animation:
        tavyaHeartAppear
        0.7s
        ease
        1.25s
        forwards,

        tavyaMainHeartBeat
        2.7s
        ease-in-out
        2.3s
        infinite;
}


#tavya-logo .tavya-word {
    opacity: 0;

    animation:
        tavyaWordAppear
        0.7s
        ease
        1.65s
        forwards;
}


#tavya-logo .letter-drop {
    opacity: 0;

    transform-box: fill-box;
    transform-origin: center;

    animation:
        tavyaLetterDropAppear
        0.55s
        ease
        2s
        forwards,

        tavyaLetterDropPulse
        2.6s
        ease-in-out
        2.8s
        infinite;
}


#tavya-logo .network-text {
    opacity: 0;

    animation:
        tavyaTextAppear
        0.6s
        ease
        2.25s
        forwards;
}


#tavya-logo .subtitle {
    opacity: 0;

    animation:
        tavyaTextAppear
        0.6s
        ease
        2.45s
        forwards;
}


#tavya-logo .tagline {
    opacity: 0;

    animation:
        tavyaTagline
        0.75s
        ease
        2.7s
        forwards;
}


#tavya-logo .middle-line {
    opacity: 0;

    animation:
        tavyaMiddleLine
        0.6s
        ease
        3.1s
        forwards;
}


#tavya-logo .middle-connection {
    opacity: 0;

    animation:
        tavyaMiddleConnection
        0.6s
        ease
        3.2s
        forwards;
}


#tavya-logo .middle-node {
    opacity: 0;

    animation:
        tavyaMiddleNode
        0.5s
        ease
        3.25s
        forwards;
}


#tavya-logo .middle-drop {
    opacity: 0;

    transform-box: fill-box;
    transform-origin: center;

    animation:
        tavyaMiddleDrop
        0.6s
        ease
        3.35s
        forwards,

        tavyaMiddleDropPulse
        2.2s
        ease-in-out
        4s
        infinite;
}


#tavya-logo .middle-heart {
    opacity: 0;

    transform-box: fill-box;
    transform-origin: center;

    animation:
        tavyaMiddleHeart
        0.65s
        ease
        3.45s
        forwards,

        tavyaMiddleHeartBeat
        2.2s
        ease-in-out
        4.1s
        infinite;
}


#tavya-logo .footer-text {
    opacity: 0;

    animation:
        tavyaTextAppear
        0.6s
        ease
        3.7s
        forwards;
}


/* ============================================================
   ANIMATIONS
   ============================================================ */

@keyframes tavyaArcDraw {

    0% {
        opacity: 0;
        stroke-dashoffset: 1800;
    }

    100% {
        opacity: 1;
        stroke-dashoffset: 0;
    }

}


@keyframes tavyaLeftHand {

    0% {
        opacity: 0;
        transform:
            translateX(-35px)
            translateY(20px)
            scale(.97);
    }

    70% {
        opacity: 1;
    }

    100% {
        opacity: 1;
        transform:
            translateX(0)
            translateY(0)
            scale(1);
    }

}


@keyframes tavyaRightHand {

    0% {
        opacity: 0;
        transform:
            translateX(35px)
            translateY(20px)
            scale(.97);
    }

    70% {
        opacity: 1;
    }

    100% {
        opacity: 1;
        transform:
            translateX(0)
            translateY(0)
            scale(1);
    }

}


@keyframes tavyaHighlight {

    0% {
        opacity: 0;
        stroke-dashoffset: 300;
    }

    100% {
        opacity: 1;
        stroke-dashoffset: 0;
    }

}


@keyframes tavyaDropAppear {

    0% {
        opacity: 0;
        transform:
            translateY(-25px)
            scale(.78);
    }

    70% {
        opacity: 1;
        transform:
            translateY(3px)
            scale(1.03);
    }

    100% {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }

}


@keyframes tavyaDropFloat {

    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-4px);
    }

}


@keyframes tavyaDropHighlight {

    0% {
        opacity: 0;
        stroke-dashoffset: 180;
    }

    100% {
        opacity: 1;
        stroke-dashoffset: 0;
    }

}


@keyframes tavyaHeartAppear {

    0% {
        opacity: 0;
        transform: scale(.35);
    }

    65% {
        opacity: 1;
        transform: scale(1.12);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }

}


@keyframes tavyaMainHeartBeat {

    0%,
    100% {
        transform: scale(1);
    }

    10% {
        transform: scale(1.07);
    }

    20% {
        transform: scale(1);
    }

    30% {
        transform: scale(1.05);
    }

    40% {
        transform: scale(1);
    }

}


@keyframes tavyaWordAppear {

    0% {
        opacity: 0;
        transform: translateY(15px);
    }

    100% {
        opacity: 1;
        transform: translateY(0);
    }

}


@keyframes tavyaLetterDropAppear {

    0% {
        opacity: 0;
        transform:
            translateY(-8px)
            scale(.65);
    }

    70% {
        opacity: 1;
        transform:
            translateY(2px)
            scale(1.05);
    }

    100% {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }

}


@keyframes tavyaLetterDropPulse {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.06);
    }

}


@keyframes tavyaTextAppear {

    0% {
        opacity: 0;
        transform: translateY(9px);
    }

    100% {
        opacity: 1;
        transform: translateY(0);
    }

}


@keyframes tavyaTagline {

    0% {
        opacity: 0;
        transform:
            translateY(12px)
            scale(.97);
    }

    100% {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }

}


@keyframes tavyaMiddleLine {

    0% {
        opacity: 0;
        transform: scaleX(0);
    }

    100% {
        opacity: 1;
        transform: scaleX(1);
    }

}


@keyframes tavyaMiddleConnection {

    0% {
        opacity: 0;
        stroke-dasharray: 60;
        stroke-dashoffset: 60;
    }

    100% {
        opacity: .65;
        stroke-dasharray: 60;
        stroke-dashoffset: 0;
    }

}


@keyframes tavyaMiddleNode {

    0% {
        opacity: 0;
        transform: scale(0);
    }

    70% {
        opacity: 1;
        transform: scale(1.25);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }

}


@keyframes tavyaMiddleDrop {

    0% {
        opacity: 0;
        transform: scale(.5);
    }

    70% {
        opacity: 1;
        transform: scale(1.08);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }

}


@keyframes tavyaMiddleDropPulse {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.10);
    }

}


@keyframes tavyaMiddleHeart {

    0% {
        opacity: 0;
        transform: scale(.3);
    }

    70% {
        opacity: 1;
        transform: scale(1.12);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }

}


@keyframes tavyaMiddleHeartBeat {

    0%,
    100% {
        transform: scale(1);
    }

    10% {
        transform: scale(1.18);
    }

    20% {
        transform: scale(1);
    }

    30% {
        transform: scale(1.12);
    }

    40% {
        transform: scale(1);
    }

}

<script>

/* ============================================================
   PREVENT RIGHT CLICK ON LOGO
   ============================================================ */

(function () {

    const logo =
        document.querySelector("#tavya-logo .tavya-logo");

    if (!logo) {
        return;
    }


    logo.addEventListener(
        "contextmenu",
        function (event) {
            event.preventDefault();
        }
    );


    /* ========================================================
       CLICK LOGO → REPLAY ALL ANIMATIONS
       ======================================================== */

    logo.addEventListener(
        "click",
        function () {

            const elements =
                logo.querySelectorAll(

                    ".outer-arc," +
                    ".left-hand," +
                    ".right-hand," +
                    ".hand-highlight," +
                    ".blood-drop," +
                    ".drop-highlight," +
                    ".heart," +
                    ".tavya-word," +
                    ".letter-drop," +
                    ".network-text," +
                    ".subtitle," +
                    ".tagline," +
                    ".middle-line," +
                    ".middle-connection," +
                    ".middle-node," +
                    ".middle-drop," +
                    ".middle-heart," +
                    ".footer-text"

                );


            elements.forEach(
                function (element) {

                    element.style.animation = "none";

                    void element.offsetWidth;

                    element.style.animation = "";

                }
            );

        }
    );

})();

</script>
