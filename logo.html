<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAVYA Blood Network - Scalable Logo with Top Curved Text</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600;700&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f4f6f8;
}

/* 
  CONTROL CONTAINER SIZE HERE:
  Modifying max-width or width scales the entire logo, 
  including all strokes, distances, and font sizes proportionally.
*/
#tavya-logo {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    display: flex;
    justify-content: center;
    align-items: center;
    background: transparent;
    user-select: none;
    cursor: pointer;
}

#tavya-logo .tavya-logo {
    display: block;
    width: 100% !important;
    height: auto !important;
    overflow: visible;
}

/* Color Classes & Styles */
#tavya-logo .outer-arc {
    fill: none !important;
    stroke: #E21B23 !important;
    stroke-width: 8;
    stroke-linecap: round;
}

#tavya-logo .curved-top-text {
    fill: #E21B23 !important;
    font-family: 'Montserrat', Arial, sans-serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 5px;
}

#tavya-logo .hand-highlight {
    fill: none !important;
    stroke: rgba(255,255,255,0.38) !important;
    stroke-width: 5;
    stroke-linecap: round;
}

#tavya-logo .drop-highlight {
    fill: none !important;
    stroke: rgba(255,255,255,0.40) !important;
    stroke-width: 8;
    stroke-linecap: round;
}

#tavya-logo .network-text { fill: #E21B23 !important; }
#tavya-logo .subtitle { fill: #6B7280 !important; }
#tavya-logo .tagline { fill: #E21B23 !important; }
#tavya-logo .footer-text { fill: #7B8490 !important; }

#tavya-logo .middle-line {
    fill: none !important;
    stroke: #E21B23 !important;
    stroke-width: 3;
    stroke-linecap: round;
}

#tavya-logo .middle-connection {
    fill: none !important;
    stroke: #E21B23 !important;
    stroke-width: 2;
    stroke-linecap: round;
}

#tavya-logo .middle-node { fill: #E21B23 !important; }
#tavya-logo .middle-drop { fill: #E21B23 !important; }
#tavya-logo .middle-heart { fill: #E21B23 !important; }

/* Animations */
#tavya-logo .outer-arc {
    opacity: 0;
    stroke-dasharray: 1800;
    stroke-dashoffset: 1800;
    animation: tavyaArcDraw 1.25s ease 0.05s forwards;
}

#tavya-logo .curved-text-group {
    opacity: 0;
    animation: tavyaTextAppear 0.8s ease 0.3s forwards;
}

#tavya-logo .left-hand {
    opacity: 0;
    transform-origin: center;
    animation: tavyaLeftHand 0.9s cubic-bezier(.2,.8,.2,1) 0.25s forwards;
}

#tavya-logo .right-hand {
    opacity: 0;
    transform-origin: center;
    animation: tavyaRightHand 0.9s cubic-bezier(.2,.8,.2,1) 0.25s forwards;
}

#tavya-logo .hand-highlight {
    opacity: 0;
    stroke-dasharray: 300;
    stroke-dashoffset: 300;
    animation: tavyaHighlight 0.75s ease 0.85s forwards;
}

#tavya-logo .blood-drop {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    animation: tavyaDropAppear 0.85s cubic-bezier(.2,.8,.2,1) 0.65s forwards, tavyaDropFloat 3.2s ease-in-out 1.8s infinite;
}

#tavya-logo .drop-highlight {
    opacity: 0;
    stroke-dasharray: 180;
    stroke-dashoffset: 180;
    animation: tavyaDropHighlight 0.7s ease 1.1s forwards;
}

#tavya-logo .heart {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    animation: tavyaHeartAppear 0.7s ease 1.25s forwards, tavyaMainHeartBeat 2.7s ease-in-out 2.3s infinite;
}

#tavya-logo .tavya-word {
    opacity: 0;
    animation: tavyaWordAppear 0.7s ease 1.65s forwards;
}

#tavya-logo .letter-drop {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    animation: tavyaLetterDropAppear 0.55s ease 2s forwards, tavyaLetterDropPulse 2.6s ease-in-out 2.8s infinite;
}

#tavya-logo .network-text { opacity: 0; animation: tavyaTextAppear 0.6s ease 2.25s forwards; }
#tavya-logo .subtitle { opacity: 0; animation: tavyaTextAppear 0.6s ease 2.45s forwards; }
#tavya-logo .tagline { opacity: 0; animation: tavyaTagline 0.75s ease 2.7s forwards; }

#tavya-logo .middle-line { opacity: 0; animation: tavyaMiddleLine 0.6s ease 3.1s forwards; }
#tavya-logo .middle-connection { opacity: 0; animation: tavyaMiddleConnection 0.6s ease 3.2s forwards; }
#tavya-logo .middle-node { opacity: 0; animation: tavyaMiddleNode 0.5s ease 3.25s forwards; }

#tavya-logo .middle-drop {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    animation: tavyaMiddleDrop 0.6s ease 3.35s forwards, tavyaMiddleDropPulse 2.2s ease-in-out 4s infinite;
}

#tavya-logo .middle-heart {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    animation: tavyaMiddleHeart 0.65s ease 3.45s forwards, tavyaMiddleHeartBeat 2.2s ease-in-out 4.1s infinite;
}

#tavya-logo .footer-text { opacity: 0; animation: tavyaTextAppear 0.6s ease 3.7s forwards; }

/* Keyframes */
@keyframes tavyaArcDraw {
    0% { opacity: 0; stroke-dashoffset: 1800; }
    100% { opacity: 1; stroke-dashoffset: 0; }
}
@keyframes tavyaLeftHand {
    0% { opacity: 0; transform: translateX(-35px) translateY(20px) scale(.97); }
    70% { opacity: 1; }
    100% { opacity: 1; transform: translateX(0) translateY(0) scale(1); }
}
@keyframes tavyaRightHand {
    0% { opacity: 0; transform: translateX(35px) translateY(20px) scale(.97); }
    70% { opacity: 1; }
    100% { opacity: 1; transform: translateX(0) translateY(0) scale(1); }
}
@keyframes tavyaHighlight {
    0% { opacity: 0; stroke-dashoffset: 300; }
    100% { opacity: 1; stroke-dashoffset: 0; }
}
@keyframes tavyaDropAppear {
    0% { opacity: 0; transform: translateY(-25px) scale(.78); }
    70% { opacity: 1; transform: translateY(3px) scale(1.03); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes tavyaDropFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
}
@keyframes tavyaDropHighlight {
    0% { opacity: 0; stroke-dashoffset: 180; }
    100% { opacity: 1; stroke-dashoffset: 0; }
}
@keyframes tavyaHeartAppear {
    0% { opacity: 0; transform: scale(.35); }
    65% { opacity: 1; transform: scale(1.12); }
    100% { opacity: 1; transform: scale(1); }
}
@keyframes tavyaMainHeartBeat {
    0%, 100% { transform: scale(1); }
    10% { transform: scale(1.07); }
    20% { transform: scale(1); }
    30% { transform: scale(1.05); }
    40% { transform: scale(1); }
}
@keyframes tavyaWordAppear {
    0% { opacity: 0; transform: translateY(15px); }
    100% { opacity: 1; transform: translateY(0); }
}
@keyframes tavyaLetterDropAppear {
    0% { opacity: 0; transform: translateY(-8px) scale(.65); }
    70% { opacity: 1; transform: translateY(2px) scale(1.05); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes tavyaLetterDropPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
}
@keyframes tavyaTextAppear {
    0% { opacity: 0; transform: translateY(9px); }
    100% { opacity: 1; transform: translateY(0); }
}
@keyframes tavyaTagline {
    0% { opacity: 0; transform: translateY(12px) scale(.97); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes tavyaMiddleLine {
    0% { opacity: 0; transform: scaleX(0); }
    100% { opacity: 1; transform: scaleX(1); }
}
@keyframes tavyaMiddleConnection {
    0% { opacity: 0; stroke-dasharray: 60; stroke-dashoffset: 60; }
    100% { opacity: .65; stroke-dasharray: 60; stroke-dashoffset: 0; }
}
@keyframes tavyaMiddleNode {
    0% { opacity: 0; transform: scale(0); }
    70% { opacity: 1; transform: scale(1.25); }
    100% { opacity: 1; transform: scale(1); }
}
@keyframes tavyaMiddleDrop {
    0% { opacity: 0; transform: scale(.5); }
    70% { opacity: 1; transform: scale(1.08); }
    100% { opacity: 1; transform: scale(1); }
}
@keyframes tavyaMiddleDropPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.10); }
}
@keyframes tavyaMiddleHeart {
    0% { opacity: 0; transform: scale(.3); }
    70% { opacity: 1; transform: scale(1.12); }
    100% { opacity: 1; transform: scale(1); }
}
@keyframes tavyaMiddleHeartBeat {
    0%, 100% { transform: scale(1); }
    10% { transform: scale(1.18); }
    20% { transform: scale(1); }
    30% { transform: scale(1.12); }
    40% { transform: scale(1); }
}
</style>
</head>
<body>

<div id="tavya-logo">
    <svg
        class="tavya-logo"
        viewBox="0 0 1254 1290"
        xmlns="http://www.w3.org/2000/svg"
        role="img"
        aria-label="TAVYA Blood Network"
    >
        <defs>
            <linearGradient id="tavyaLogoBlueGradient" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#1D8BD1"/>
                <stop offset="100%" stop-color="#07517F"/>
            </linearGradient>

            <linearGradient id="tavyaLogoRedGradient" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#F3343D"/>
                <stop offset="100%" stop-color="#C50713"/>
            </linearGradient>

            <linearGradient id="tavyaLogoBloodGradient" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#F52D36"/>
                <stop offset="100%" stop-color="#B70712"/>
            </linearGradient>

            <filter id="tavyaLogoShadow" x="-30%" y="-30%" width="160%" height="170%">
                <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#75000B" flood-opacity=".20"/>
            </filter>

            <!-- Path template for the top curved text (positioned directly above the outer arc) -->
            <path id="topTextArcPath" d="M 210 395 A 420 420 0 0 1 1044 395" fill="none" />
        </defs>

        <!-- OUTER RED ARC -->
        <path class="outer-arc" fill="none" stroke="#E21B23" d="M250 455 A380 380 0 0 1 1004 455"/>

        <!-- TOP CURVED TEXT ALONG THE ARC -->
        <g class="curved-text-group">
            <text class="curved-top-text" text-anchor="middle">
                <textPath href="#topTextArcPath" startOffset="50%">
                    DONATE &bull; SUPPORT &bull; SAVE LIVES
                </textPath>
            </text>
        </g>

        <!-- LEFT BLUE HELPING HAND -->
        <path class="left-hand" fill="url(#tavyaLogoBlueGradient)" d="M306 344 L303 348 L309 398 L324 464 L343 514 L357 540 L372 561 L395 583 L421 601 L449 616 L528 650 L562 670 L589 693 L615 728 L615 656 L612 638 L603 610 L593 591 L579 572 L560 553 L541 539 L516 526 L460 506 L431 486 L398 451 L390 447 L379 447 L374 452 L374 462 L386 488 L410 521 L448 558 L446 559 L435 554 L414 540 L400 527 L385 508 L367 474 L363 461 L365 441 L342 370 L325 349 L315 344 Z"/>

        <!-- RIGHT RED HELPING HAND -->
        <path class="right-hand" fill="url(#tavyaLogoRedGradient)" d="M947 346 L940 345 L928 350 L913 367 L906 382 L887 444 L890 460 L884 479 L864 514 L837 543 L819 555 L804 561 L846 519 L864 494 L879 462 L879 455 L873 449 L863 449 L853 454 L820 489 L794 507 L736 528 L707 543 L687 558 L667 579 L650 606 L639 638 L636 658 L636 728 L656 700 L687 672 L727 650 L790 625 L823 609 L853 589 L879 563 L907 517 L929 460 L945 389 L949 360 L949 348 Z"/>

        <!-- HAND HIGHLIGHTS -->
        <path class="hand-highlight" fill="none" stroke="rgba(255,255,255,.38)" d="M348 389 C355 420 361 452 374 474 C391 502 412 521 444 542 C463 554 477 562 492 570"/>
        <path class="hand-highlight" fill="none" stroke="rgba(255,255,255,.38)" d="M906 389 C899 420 893 452 880 474 C863 502 842 521 810 542 C791 554 777 562 762 570"/>

        <!-- MAIN RED BLOOD DROP -->
        <path class="blood-drop" fill="url(#tavyaLogoBloodGradient)" filter="url(#tavyaLogoShadow)" d="M627 132 C627 132 487 315 487 410 C487 492 543 546 627 546 C711 546 767 492 767 410 C767 315 627 132 627 132 Z"/>

        <!-- DROP HIGHLIGHT -->
        <path class="drop-highlight" fill="none" stroke="rgba(255,255,255,.40)" d="M560 265 C536 303 520 334 516 362"/>

        <!-- MAIN WHITE HEART -->
        <path class="heart" fill="#FFFFFF" d="M627 454 C608 437 552 402 552 357 C552 326 579 312 601 329 C612 337 620 347 627 357 C634 347 642 337 653 329 C675 312 702 326 702 357 C702 402 646 437 627 454 Z"/>

        <!-- TAVYA WORDMARK -->
        <path class="tavya-word" fill="#07517F" d="M155 705 H330 V748 H270 V890 H220 V748 H155 Z"/>
        <path class="tavya-word" fill="#07517F" d="M345 890 L420 705 L495 890 H451 L420 812 L389 890 Z"/>
        <path class="tavya-word" fill="#07517F" d="M505 705 H558 L627 838 L696 705 H749 L650 890 H604 Z"/>
        <path class="tavya-word" fill="#07517F" d="M750 705 H808 L850 770 L892 705 H950 L876 815 V890 H824 V815 Z"/>
        <path class="tavya-word" fill="#07517F" d="M935 890 L1005 705 L1075 890 H1032 L1005 812 L978 890 Z"/>

        <!-- LETTER DROPS -->
        <path class="letter-drop" fill="url(#tavyaLogoBloodGradient)" d="M420 833 C420 833 402 857 402 871 C402 884 410 892 420 892 C430 892 438 884 438 871 C438 857 420 833 420 833 Z"/>
        <path class="letter-drop" fill="url(#tavyaLogoBloodGradient)" d="M1005 833 C1005 833 987 857 987 871 C987 884 995 892 1005 892 C1015 892 1023 884 1023 871 C1023 857 1005 833 1005 833 Z"/>

        <!-- TEXT CONTENT -->
        <text class="network-text" fill="#E21B23" x="627" y="957" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="47" font-weight="600" letter-spacing="2">BLOOD NETWORK</text>
        <text class="subtitle" fill="#6B7280" x="627" y="1008" text-anchor="middle" font-family="Raleway, Arial, sans-serif" font-size="25" font-weight="500">Transfusion Access &amp; Voluntary Assistance</text>
        <text class="tagline" fill="#E21B23" x="627" y="1075" text-anchor="middle" font-family="Georgia, serif" font-size="48" font-style="italic">Connecting Donors · Saving Lives</text>

        <!-- MIDDLE DESIGN -->
        <g class="middle-design">
            <line class="middle-line" x1="485" y1="1135" x2="550" y2="1135"/>
            <line class="middle-connection" x1="550" y1="1135" x2="600" y2="1135"/>
            <line class="middle-connection" x1="654" y1="1135" x2="704" y2="1135"/>
            <line class="middle-line" x1="704" y1="1135" x2="769" y2="1135"/>
            <circle class="middle-node" cx="550" cy="1135" r="5"/>
            <circle class="middle-node" cx="704" cy="1135" r="5"/>
            <path class="middle-drop" fill="#E21B23" d="M627 1098 C620 1108 616 1116 616 1123 C616 1131 621 1136 627 1136 C633 1136 638 1131 638 1123 C638 1116 634 1108 627 1098 Z"/>
            <path class="middle-heart" fill="#E21B23" d="M627 1170 C621 1164 607 1155 607 1146 C607 1138 616 1135 622 1142 L627 1148 L632 1142 C638 1135 647 1138 647 1146 C647 1155 633 1164 627 1170 Z"/>
        </g>

        <!-- FOOTER -->
        <text class="footer-text" fill="#7B8490" x="627" y="1210" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="1.8">A VOLUNTEER-RUN, NON-PROFIT INITIATIVE</text>
    </svg>
</div>

<script>
document.querySelector("#tavya-logo").addEventListener("click", function () {
    const logo = document.querySelector(".tavya-logo");
    const elements = logo.querySelectorAll(
        ".outer-arc, .curved-text-group, .left-hand, .right-hand, .hand-highlight, .blood-drop, .drop-highlight, .heart, .tavya-word, .letter-drop, .network-text, .subtitle, .tagline, .middle-line, .middle-connection, .middle-node, .middle-drop, .middle-heart, .footer-text"
    );
    elements.forEach(function (element) {
        element.style.animation = "none";
        void element.offsetWidth;
        element.style.animation = "";
    });
});
</script>

</body>
</html>
